name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest tests -q

      - name: Build Windows package
        run: |
          .\build_windows.bat

      - name: Create archive
        run: |
          if (Test-Path '.\dist\NeuroPOMDP') {
            Compress-Archive -Path '.\dist\NeuroPOMDP\*' -DestinationPath '.\release\NeuroPOMDP-${{ github.ref_name }}-windows.zip' -Force
          }

      - name: Create SHA256
        run: |
          Get-FileHash '.\release\NeuroPOMDP-${{ github.ref_name }}-windows.zip' -Algorithm SHA256 | Out-File '.\release\NeuroPOMDP-${{ github.ref_name }}-windows.zip.sha256'

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            .\release\NeuroPOMDP-${{ github.ref_name }}-windows.zip
            .\release\NeuroPOMDP-${{ github.ref_name }}-windows.zip.sha256
